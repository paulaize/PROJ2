# Build on Windows; colleagues receive the packed result, not a solver.
# Conda owns Python/VC runtime; pip owns the scientific and Qt stack.
name: lys-irm-windows-t2
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - ucrt
  - vc14_runtime
  - pip:
      - antspyx==0.6.3
      - numpy==1.26.4
      - scipy==1.15.2
      - matplotlib==3.10.9
      - nibabel==5.4.0
      - PySide6==6.11.1
      - PySide6-Fluent-Widgets==1.11.2
      - torch==2.13.0
      - torchvision==0.28.0
      - nnunetv2==2.8.1
      - acvl-utils==0.2.6
      - SimpleITK==2.5.5
      - scikit-image==0.26.0
      - brkraw==0.5.7
      - XlsxWriter>=3.2,<4
      - statsmodels
      - scikit-learn
      - pyyaml
      - webcolors
      - pillow
      - requests
