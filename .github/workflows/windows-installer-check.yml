name: Recheck offline Windows installer

on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-t2-quiet-*']

permissions:
  contents: read
  actions: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check Windows PowerShell 5 syntax
        shell: powershell
        run: |
          Get-ChildItem packaging/windows-native/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Download the previously verified runtime without resolving dependencies
        uses: actions/download-artifact@v6
        with:
          name: windows-t2-runtime
          path: dist/runtime
          run-id: 35277637679
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check offline installation, quiet output, logs, native Qt and safe failure
        run: python tests/windows_offline_install_check.py --runtime-directory dist/runtime
