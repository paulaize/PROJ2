name: Build offline Windows T2 runtime

on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-t2-offline-*']

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: '3.11'
          activate-environment: builder
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install packaging tools on the build host
        shell: bash -el {0}
        run: python -m pip install conda-pack==0.8.1
      - name: Build and test the Windows runtime, including relocation
        shell: bash -el {0}
        run: python scripts/packaging/build_windows_runtime.py --conda "$CONDA_EXE"
      - name: Upload the verified runtime for final assembly with local T2 models
        uses: actions/upload-artifact@v6
        with:
          name: windows-t2-runtime
          path: dist/runtime/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
