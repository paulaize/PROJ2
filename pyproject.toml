[project]
name = "lys-irm"
version = "0.1.0"
description = "LYS IRM subject-centred mouse MRI analysis desktop application and backend."
requires-python = ">=3.10"
dependencies = [
  "antspyx==0.6.3",
  "matplotlib>=3.8",
  "nibabel>=5.2",
  "numpy>=1.26,<2.4",
  "scipy==1.15.2",
  "SimpleITK>=2.3",
  "XlsxWriter>=3.2,<4",
]

[project.scripts]
lys-irm-desktop = "lys_bbb_app.main:main"
lys-irm-t2-infer = "lys_bbb.t2_inference_cli:main"
lys-irm-t1-mask = "lys_bbb.t1_brain_mask_cli:main"
lys-irm-t1-mask-setup = "lys_bbb.t1_brain_mask_setup_cli:main"

[project.optional-dependencies]
conversion = ["brkraw==0.5.7"]
brain-refinement = ["scikit-image>=0.23,<1"]
desktop = [
  "PySide6>=6.7,<7",
  "PySide6-Fluent-Widgets==1.11.2",
  "brkraw==0.5.7",
]
t2-inference = ["nnunetv2==2.8.1", "torch>=2.2"]
t1-inference = [
  "acvl-utils>=0.2.6,<0.3",
  "batchgenerators>=0.25,<1",
  "einops>=0.4",
  "gdown>=5,<6",
  "imageio>=2.22",
  "monai==1.4.0",
  "pandas>=1.5",
  "tifffile>=2022.10",
  "torch>=2.2",
]
test = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
